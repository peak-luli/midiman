<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="robots" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Middleman</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="side">
  <nav id="nav" class="seg nav">
    <a href="index.html" class="on" aria-current="page">Practice</a>
    <a href="looper.html">Looper</a>
    <a href="learn.html">Learn</a>
    <a href="composer.html">Composer</a>
  </nav>
  <h2>Backing tracks</h2>
  <div id="tracks"></div>
</div>

<main>
  <div id="bar">
    <span class="grp">
      <button id="play">▶ Play</button>
      <button id="stop">■ Stop</button>
      <button id="metroBtn" class="tgl">● Click</button>
    </span>
    <span id="outsel"></span>
    <span class="grp">
      <label id="melLabel" class="chk"><input type="checkbox" id="melody"> Melody</label>
      <button id="melSoundBtn" class="tgl icon" hidden title="melody sound: play the written melody out loud (only while Melody is shown)">♪</button>
    </span>
    <span id="pos">–</span>
    <span class="grp">
      <span id="speed">Speed
        <input type="range" id="tempo" min="50" max="200" step="1" value="100">
        <b id="bpmv" contenteditable="plaintext-only" inputmode="numeric"
           title="click to type a tempo">100</b> bpm</span>
      <span id="vol">Volume
        <input type="range" id="volume" min="0" max="100" step="1" value="100"
               title="how loud the app plays, against your own playing">
        <b id="volumev">100%</b></span>
    </span>
    <span class="grp">
      <span id="played">–</span><span id="inled" title="MIDI in"></span>
    </span>
    <span id="statusEl">connecting…</span>
  </div>

  <div id="sheet">
    <div class="strip" id="grid"></div>
    <div id="notewrap"><div id="notation"></div><div id="barhl"></div></div>
  </div>

  <div id="bottom"><div id="info"></div><div id="kb"></div></div>
</main>

<script src="vendor/abcjs-basic-min.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
